<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bannerfall Phase 1.7 - Directed Charge Prototype" />
    <title>Bannerfall - Phase 1.7 Directed Charge</title>
  </head>
  <body>
    <main id="app">
      <section class="game-shell">
        <header class="topbar">
          <div>
            <h1>BANNERFALL</h1>
            <p>Phase 1.7 — Directed Charge Prototype</p>
          </div>
          <div class="scoreboard">
            <span id="blue-count" class="blue">BLUE 20/20</span>
            <span id="status">VOLLEY READY</span>
            <span id="red-count" class="red">RED 20/20</span>
          </div>
        </header>

        <div class="battle-info">
          <span>射撃戦を続けるか、自分で突撃方向を決めて戦列を崩すか。敵軍も状況次第で射撃・後退・突撃を選ぶ。</span>
          <strong id="reload" class="ready">READY — FIRE!</strong>
        </div>

        <div class="canvas-wrap">
          <canvas id="game" width="1280" height="720" aria-label="Bannerfall directed charge battlefield"></canvas>
          <div class="overlay hidden" id="pause-overlay">
            <div class="overlay-card">
              <h2>PAUSED</h2>
              <p>Esc / P で再開</p>
            </div>
          </div>
        </div>

        <footer class="controls">
          <span><kbd>WASD</kbd> 戦列移動</span>
          <span><kbd>Mouse</kbd> 戦列の向き</span>
          <span><kbd>Left Click</kbd> 一斉射撃</span>
          <span><kbd>Hold Right Click / Space</kbd> 突撃方向を指定</span>
          <span><kbd>Release</kbd> 突撃</span>
          <span><kbd>Esc / P</kbd> 一時停止</span>
          <span><kbd>R</kbd> 再戦</span>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
