<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bannerfall Phase 1 - Player vs AI combat prototype" />
    <title>Bannerfall - Phase 1 Combat Prototype</title>
  </head>
  <body>
    <main id="app">
      <section class="game-shell">
        <header class="topbar">
          <div>
            <h1>Bannerfall</h1>
            <p>Phase 1 — Player vs AI Combat Prototype</p>
          </div>
          <div class="status" id="status">BATTLE</div>
        </header>

        <div class="canvas-wrap">
          <canvas id="game" width="960" height="540" aria-label="Bannerfall game field"></canvas>
          <div class="overlay hidden" id="pause-overlay">
            <div class="overlay-card">
              <h2>PAUSED</h2>
              <p>Esc / P で再開</p>
            </div>
          </div>
        </div>

        <footer class="controls">
          <span><kbd>WASD</kbd> 移動</span>
          <span><kbd>Mouse</kbd> 向き</span>
          <span><kbd>Left Click</kbd> 攻撃</span>
          <span><kbd>Esc / P</kbd> 一時停止</span>
          <span><kbd>R</kbd> リスタート</span>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
