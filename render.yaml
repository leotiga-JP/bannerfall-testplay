services:
  - type: web
    name: bannerfall-game
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server --omit=dev
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: '24.21.0'
